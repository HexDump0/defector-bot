[package]
name = "defector-lab"
version = "0.1.0"
edition = "2024"
description = "Fast local Defector tournament simulator powered by Boa"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
boa_engine = { version = "0.22.0", default-features = false }
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.176"
oxc = { version = "=0.146.0", default-features = false, features = ["codegen", "semantic", "transformer"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
rayon = "1.11.0"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
